services:
  story-laravel-app:
    build:
      context: .
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    command: php artisan serve --host=0.0.0.0 --port=8000

  postgres_database:
    image: postgres:16
    environment:
      POSTGRES_DB: kidsstory
      POSTGRES_USER: story_admnin
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
